<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fly Blaster — WhatsApp Blast System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style-blast.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Mobile Header -->
  <header class="mobile-header">
    <button class="menu-toggle" id="menu-toggle-btn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
    <span class="mobile-brand-name">Fly Blaster</span>
  </header>

  <!-- Sidebar overlay backdrop -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        </div>
        <span class="brand-name">Fly Blaster</span>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item active" data-action="nav" data-nav="dashboard">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          Dashboard
        </button>
        <button class="nav-item" data-action="nav" data-nav="contacts">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5 17c.6-2 2-3 4-3s3.4 1 4 3"/><path d="M14 8h5M14 12h5M14 16h3"/></svg>
          Groups
        </button>
        <button class="nav-item" data-action="nav" data-nav="templates">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg>
          Templates
        </button>
        <button class="nav-item" data-action="nav" data-nav="campaign">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
          Campaigns
        </button>
        <button class="nav-item" data-action="nav" data-nav="calendar">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Calendar
        </button>
        <button class="nav-item" data-action="nav" data-nav="blasting">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l3 5V4L6 9H5a2 2 0 0 0-2 2Z"/><path d="M17 8a4 4 0 0 1 0 8"/><path d="M20 5a8 8 0 0 1 0 14"/></svg>
          Blasting
        </button>
        <button class="nav-item" data-action="nav" data-nav="settings">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
          Settings
        </button>
        <button class="nav-item" id="logout-btn" style="color: #ef4444; border-top: 1px solid var(--border-soft); margin-top: 8px; border-radius: 0; padding-top: 12px; display: flex; align-items: center; gap: 11px;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          Logout
        </button>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="page-dashboard" class="page"></div>
      <div id="page-groups" class="page" style="display:none;"></div>
      <div id="page-group-detail" class="page" style="display:none;"></div>
      <div id="page-templates" class="page" style="display:none;"></div>
      <div id="page-campaigns" class="page" style="display:none;"></div>
      <div id="page-campaign-detail" class="page" style="display:none;"></div>
      <div id="page-calendar" class="page" style="display:none;"></div>
      <div id="page-blasting" class="page" style="display:none;"></div>
      <div id="page-placeholder" class="page" style="display:none;">
        <div class="wrap">
          <div class="placeholder-card">
            <h2 id="placeholder-title">Coming soon</h2>
            <p id="placeholder-desc">This section hasn't been built yet.</p>
          </div>
        </div>
      </div>
      <div id="page-settings" class="page" style="display:none;"></div>
    </main>
  </div>

  <div id="modal-root"></div>

  <div id="login-overlay" style="display: none; position: fixed; inset: 0; background: radial-gradient(circle at top left, #1e1b3a, #0b0914); align-items: center; justify-content: center; z-index: 9999; font-family: 'Inter', sans-serif; color: #ffffff;">
    <div class="login-card" style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(16px); padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); text-align: center;">
      <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #7c3aed, #a855f7); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="white" stroke-width="2.5"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      </div>
      <h2 style="font-size: 22px; font-weight: 750; margin-bottom: 8px; letter-spacing: -0.5px;">Welcome Back</h2>
      <p style="color: rgba(255, 255, 255, 0.6); font-size: 13.5px; margin-bottom: 30px;">Sign in to access Fly Blaster V2</p>
      
      <form id="login-form" style="display: flex; flex-direction: column; gap: 16px; text-align: left;">
        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: rgba(255, 255, 255, 0.5);">Email Address</label>
          <input type="email" id="login-email" required style="width: 100%; height: 42px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0,0,0,0.2); padding: 10px 14px; font-size: 13.5px; color: white; outline: none; transition: border-color 0.2s;" placeholder="you@example.com" />
        </div>
        <div>
          <label style="display: block; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; color: rgba(255, 255, 255, 0.5);">Password</label>
          <input type="password" id="login-password" required style="width: 100%; height: 42px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0,0,0,0.2); padding: 10px 14px; font-size: 13.5px; color: white; outline: none; transition: border-color 0.2s;" placeholder="••••••••" />
        </div>
        <div id="login-error" style="color: #ef4444; font-size: 12.5px; text-align: center; display: none; margin-top: 4px;"></div>
        <button type="submit" style="width: 100%; height: 42px; background: linear-gradient(135deg, #7c3aed, #a855f7); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; transition: transform 0.1s, opacity 0.2s; margin-top: 10px; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.2);">Sign In</button>
      </form>
    </div>
  </div>

  <script src="app-blast.js"></script>
</body>
</html>
